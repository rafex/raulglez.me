name: Deploy Full System (legacy)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag presente en las cuatro imágenes de servicio'
        required: true
        type: string
        default: 'latest'

concurrency:
  group: deploy-full-system
  cancel-in-progress: false

permissions:
  contents: read

env:
  K3S_NAMESPACE: raulglez-me
  APP_ENV_SECRET: raulglez-me-env

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Validate image tag
        id: tag
        env:
          DEPLOY_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$DEPLOY_TAG" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid image tag: use only letters, numbers, '.', '_' or '-'." >&2
            exit 1
          fi
          echo "value=$DEPLOY_TAG" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBECONFIG_DATA" | base64 -d >/tmp/kubeconfig.decoded 2>/dev/null; then
            cp /tmp/kubeconfig.decoded "$HOME/.kube/config"
          else
            printf '%s' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"

      - name: Create GHCR pull secret
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --namespace="$K3S_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create app environment secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          MODEL_VALUE="${GROQ_MODEL:-llama-3.3-70b-versatile}"
          kubectl create secret generic "$APP_ENV_SECRET" \
            --from-literal=GROQ_API_KEY="$GROQ_API_KEY" \
            --from-literal=GROQ_MODEL="$MODEL_VALUE" \
            --from-literal=AI_SERVICE_URL=http://raulglez-backend-ia:3000 \
            --from-literal=AI_PORT=3000 \
            --from-literal=ADMIN_USER="$ADMIN_USER" \
            --from-literal=ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            --from-literal=SESSION_SECRET="$SESSION_SECRET" \
            --from-literal=COOKIE_SECURE=true \
            --namespace="$K3S_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Mosquitto
        run: |
          helm upgrade --install mosquitto helm/raulglez-me/mosquitto \
            --namespace "$K3S_NAMESPACE" \
            --create-namespace \
            --wait --timeout 2m

      - name: Deploy backend portal
        run: |
          helm upgrade --install raulglez-backend-portal helm/raulglez-me/backend-portal \
            --namespace "$K3S_NAMESPACE" \
            --create-namespace \
            --set image.repository=ghcr.io/${{ github.repository_owner }}/raulglez-backend-portal \
            --set image.tag=${{ steps.tag.outputs.value }} \
            --wait --timeout 3m

      - name: Deploy backend AI
        run: |
          helm upgrade --install raulglez-backend-ia helm/raulglez-me/backend-ia \
            --namespace "$K3S_NAMESPACE" \
            --create-namespace \
            --set image.repository=ghcr.io/${{ github.repository_owner }}/raulglez-backend-ia \
            --set image.tag=${{ steps.tag.outputs.value }} \
            --wait --timeout 15m

      - name: Deploy public portal
        run: |
          helm upgrade --install raulglez-portal-publico helm/raulglez-me/portal-publico \
            --namespace "$K3S_NAMESPACE" \
            --create-namespace \
            --set image.repository=ghcr.io/${{ github.repository_owner }}/raulglez-portal-publico \
            --set image.tag=${{ steps.tag.outputs.value }} \
            --wait --timeout 3m

      - name: Deploy admin portal
        run: |
          helm upgrade --install raulglez-portal-admin helm/raulglez-me/portal-admin \
            --namespace "$K3S_NAMESPACE" \
            --create-namespace \
            --set image.repository=ghcr.io/${{ github.repository_owner }}/raulglez-portal-admin \
            --set image.tag=${{ steps.tag.outputs.value }} \
            --wait --timeout 3m

      - name: Verify deployment
        run: kubectl -n "$K3S_NAMESPACE" get deploy,pods,svc,ingress -o wide

      - name: Debug rollout failure
        if: failure()
        run: |
          kubectl -n "$K3S_NAMESPACE" get deploy,rs,pods,svc -o wide || true
          kubectl -n "$K3S_NAMESPACE" get events --sort-by=.metadata.creationTimestamp | tail -n 80 || true
